# docker-compose.prod.yml
# Used on the EC2 server — pulls pre-built images from Docker Hub.
# Postgres now runs on RDS (provisioned by Terraform), not as a local container.
# DB_HOST, DB_PASSWORD, DOCKERHUB_USERNAME, IMAGE_TAG come from the .env file
# written by GitHub Actions during deploy.

services:

  backend:
    image: ${DOCKERHUB_USERNAME}/desk-analytics-backend:${IMAGE_TAG:-latest}
    container_name: desk_backend
    restart: always
    environment:
      DB_URL:                       jdbc:postgresql://${DB_HOST}:5432/desk_analytics
      DB_USER:                      postgres
      DB_PASSWORD:                  ${DB_PASSWORD}
      SENSOR_API_BASE_URL:          https://flask.claircoair.com/api/v1/desktherm-realtime
      SENSOR_IDS:                   2c:cf:67:ff:f5:f4
      SENSOR_POLL_INTERVAL_SECONDS: 30
      SERVER_PORT:                  8080
      SERVER_CORS_ORIGIN:           "*"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/occupancy/live?sensorId=2c:cf:67:ff:f5:f4 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  ml-service:
    image: ${DOCKERHUB_USERNAME}/desk-analytics-ml:${IMAGE_TAG:-latest}
    container_name: desk_ml
    restart: always
    environment:
      ML_PORT: 5001
    ports:
      - "5001:5001"
    volumes:
      - ml_models:/app/models
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5001/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    image: ${DOCKERHUB_USERNAME}/desk-analytics-frontend:${IMAGE_TAG:-latest}
    container_name: desk_frontend
    restart: always
    depends_on:
      - backend
      - ml-service
    ports:
      - "3000:80"

volumes:
  ml_models:
